<div class="max-w-4xl mx-auto p-6 mt-10 bg-white rounded-lg shadow-lg">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Application Dashboard</h1>
    <div class="flex gap-4">
      <button (click)="logout()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">Logout</button>
    </div>
  </div>

  <!-- Search and Actions Bar -->
  <div class="mb-6 space-y-4">
    <div class="flex gap-4 items-center">
      <div class="flex-1">
        <input 
          type="text" 
          placeholder="Search users (Debounced)..." 
          (input)="onSearch($event)"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
        />
      </div>
      <button (click)="onRefresh()" [disabled]="isLoading" 
              class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <svg *ngIf="isLoading" class="animate-spin h-4 w-4" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Refresh (Throttled)</span>
      </button>
    </div>

    <div class="flex gap-4">
      <button (click)="testUnauthorizedHit()" [disabled]="isLoading" 
              class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
        Simulate 401 Hacker Hit
      </button>
    </div>
  </div>

  <!-- Status Indicators -->
  <div *ngIf="isLoading" class="p-4 mb-6 bg-blue-50 border border-blue-200 rounded-lg flex items-center gap-3 animate-pulse">
    <span class="text-blue-700 font-medium">Communicating with Backend...</span>
  </div>

  <div *ngIf="errorMessage" class="p-4 mb-6 bg-red-100 border border-red-400 text-red-700 rounded-lg">
    <strong>API Security Exception:</strong> {{ errorMessage }}
  </div>

  <!-- Data Display -->
  <div *ngIf="!isLoading && !errorMessage">
    <h2 class="text-xl font-semibold mb-3 border-b pb-2">Active PostgreSQL Users</h2>
    <div *ngIf="users.length === 0" class="text-gray-500 italic">No users currently exist in the PostgreSQL Database.</div>
    
    <ul class="space-y-2">
      <li *ngFor="let user of users" class="p-3 bg-gray-50 border rounded-lg shadow-sm flex justify-between items-center transition hover:bg-white hover:shadow-md">
        <div class="flex flex-col">
          <span class="font-bold text-gray-800">{{ user.name }}</span>
          <span class="text-sm text-gray-500">{{ user.email }}</span>
        </div>
        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded uppercase">Database Source</span>
      </li>
    </ul>
  </div>
</div>
