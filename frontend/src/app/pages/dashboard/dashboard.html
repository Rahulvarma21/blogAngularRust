<h2>Cart Summary (Dashboard)</h2>
<p style="color: green; font-weight: bold;">This is a PROTECTED page.</p>

<hr />
<!-- Edge Case Demonstration via Service Error Tracking -->
<div *ngIf="stateService.error$() as errorMsg" style="background: pink; color: red; padding: 10px; border-radius: 4px; margin-bottom: 10px;">
  <strong>Edge Case Triggered/Handled:</strong> {{ errorMsg }}
</div>

<!-- Empty data state simulation / edge case -->
<div *ngIf="stateService.isCartEmpty(); else showCart" style="font-weight: bold; font-style: italic; color: #555;">
  Your cart is completely empty! Navigate back Home to add products. 
</div>

<ng-template #showCart>
  <ul>
    <!-- Read state solely via the computed signal from our Service -->
    <li *ngFor="let item of stateService.cartItems$()" style="margin-bottom: 15px;">
      <strong>{{ item.name }}</strong> (x{{ item.quantity }})
      <button (click)="stateService.removeFromCart(item.id)" style="margin-left: 15px; color: white; background: red; padding: 2px 6px; border: none; border-radius: 4px; cursor: pointer;">
        Remove Item
      </button>
    </li>
  </ul>
  
  <button (click)="stateService.clearCart()" style="background: orange; border: none; padding: 6px 12px; cursor: pointer; border-radius:4px;">
    Clear Whole Cart
  </button>
</ng-template>

<hr />
<button (click)="logout()">Logout & Leave Dashboard</button>
